<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>Task Manager</h2>

        <!-- Task Form -->
        <form method="POST" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="New Task" required>
            <input type="date" name="due_date">
            <select name="priority">
                <option value="High">🔥 High</option>
                <option value="Medium" selected>⚡ Medium</option>
                <option value="Low">✅ Low</option>
            </select>
            <select name="category">
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Shopping">Shopping</option>
            </select>
            <input type="file" name="attachment">
            <button type="submit">Add Task</button>
        </form>

        <!-- Task List -->
        <ul class="task-list">
            {% for task in tasks %}
                <li class="task-item {% if task.completed %}completed{% endif %}" id="task-{{ task.id }}">
                    <div class="task-details">
                        <strong>{{ task.title }}</strong>
                        <span class="task-meta">
                            <span class="priority {{ task.priority.lower() }}">{{ task.priority }}</span>
                            <span class="category">{{ task.category }}</span>
                        </span>
                    </div>
                    <div class="task-actions">
                        <button onclick="markDone({{ task.id }})" class="complete-btn">
                            {% if task.completed %}✔ Done{% else %}Mark Done{% endif %}
                        </button>
                        <button onclick="deleteTask({{ task.id }})" class="delete-btn">❌</button>
                    </div>
                </li>
            {% endfor %}
        </ul>

        <button onclick="clearTasks()" class="clear-btn">🗑 Clear All Tasks</button>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const tasksContainer = document.querySelector(".task-list");
            const tasks = document.querySelectorAll(".task-item");

            tasks.forEach(task => {
                task.draggable = true;

                task.addEventListener("dragstart", () => {
                    task.classList.add("dragging");
                });

                task.addEventListener("dragend", () => {
                    task.classList.remove("dragging");
                });
            });

            tasksContainer.addEventListener("dragover", (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(tasksContainer, e.clientY);
                const dragging = document.querySelector(".dragging");
                if (afterElement == null) {
                    tasksContainer.appendChild(dragging);
                } else {
                    tasksContainer.insertBefore(dragging, afterElement);
                }
            });

            function getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll(".task-item:not(.dragging)")];

                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }
        });

        function markDone(taskId) {
            fetch(`/task/complete/${taskId}`).then(() => {
                document.getElementById(`task-${taskId}`).classList.add("completed");
            });
        }

        function deleteTask(taskId) {
        fetch(`/task/delete/${taskId}`, { method: "GET" })
            .then(response => {
                if (response.ok) {
                    document.getElementById(`task-${taskId}`).remove();
                } else {
                    alert("Failed to delete task.");
                }
            })
            .catch(error => console.error("Error deleting task:", error));
        }

        function clearTasks() {
        fetch(`/task/clear`, { method: "GET" })
            .then(response => {
                if (response.ok) {
                    document.querySelector(".task-list").innerHTML = ""; // Clear UI
                } else {
                    alert("Failed to clear tasks.");
                }
            })
            .catch(error => console.error("Error clearing tasks:", error));
        }
    </script>
</body>
</html>
